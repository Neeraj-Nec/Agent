services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: research_workspace
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace -d research_workspace"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://workspace:workspace@database:5432/research_workspace
      DOCUMENT_STORAGE_PATH: /data/documents
    volumes:
      - ./backend/app:/app/app
      - ./backend/var:/data
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres_data:
